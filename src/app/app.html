<h1>SpotiSqz</h1>

<button (click)="auth.login()">Connect Spotify</button>
<p>{{ auth.status() }}</p>

<!-- Clicking invokes the method defined in app.ts.
     Disable the button while a request is in progress. -->
<button
  (click)="loadPlaylists()"
  [disabled]="loadingPlaylists()"
>
  Load playlists
</button>

<!-- Read the signal to display progress, success or an error. -->
<p>{{ playlistStatus() }}</p>

<!-- Display the retrieved playlists as a simple list for now. -->
<ul>
  <!-- Use each playlist's unique ID to identify its rendered entry. -->
  @for (playlist of playlists(); track playlist.id) {
    <li>{{ playlist.name }}</li>
  }
</ul>

<div class="track-grid">
  @for (track of tracks; track $index) {
    <button
      class="track"
      [class.selected]="selectedIndex() === $index"
      (click)="selectedIndex.set($index)"
    >
      {{ track }}
    </button>
  }
</div>

@if (selectedIndex() !== null) {
  <p>{{ tracks[selectedIndex()!] }}</p>
} @else {
  <p>Tap a track.</p>
}
